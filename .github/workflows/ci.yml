# What a hosted runner can check: rustfmt, the build and the docs with warnings
# as errors, every unit and integration test, the generated Slang module against its
# declarations, the render example and the conformance runner's UI corpus on
# Mesa's software Vulkan, and the link check. HarfBuzz's own
# corpus is fetched and run locally (README.md, *The conformance runner*).
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Where the shader-slang build keeps the Slang release it downloads, so the
  # cache below can hold it.
  SHADER_SLANG_CACHE_DIR: ${{ github.workspace }}/.shader-slang-cache

jobs:
  check-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # fontconfig and sans-serif fonts for the tests that load one (they skip
      # without one; Noto Sans lacks the arrows the font tests require,
      # DejaVu Sans has them); lavapipe for the examples; spirv-val for the
      # compile tests. The Slang compiler itself comes with the tree.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fontconfig fonts-noto-core fonts-dejavu-core \
            mesa-vulkan-drivers libvulkan1 spirv-tools

      # The Slang release archive the shader-slang build downloads, keyed on
      # the pinned revision of the crate that names it.
      - name: Slang release
        uses: actions/cache@v5
        with:
          path: .shader-slang-cache
          key: shader-slang-${{ hashFiles('slang/Cargo.toml') }}

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Check, with warnings as errors
        run: cargo check --locked --workspace --all-targets

      # Every intra-doc link resolves and none points at a private item.
      - name: Docs, with warnings as errors
        run: cargo doc --locked --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

      - name: The generated module matches its declarations
        run: |
          cargo run --locked -p punchcutter-shape --bin gen-slang
          git diff --exit-code -- slang/modules/shape_abi.slang

      - name: The render example, on lavapipe
        run: cargo run --locked -p punchcutter-text --example render

      - name: The conformance runner's UI corpus, on lavapipe
        run: cargo run --locked -p punchcutter-shape --example conform -- --ui-only

      - name: The rendered PNGs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: render
          path: text/test-runs/
          if-no-files-found: ignore

      - name: Links
        run: docs/check-links.sh
